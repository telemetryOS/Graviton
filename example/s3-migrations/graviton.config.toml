# S3 example (works with any S3-compatible store: AWS S3, MinIO, R2, Spaces).
#
# The "database" is a bucket, optionally under a key prefix. Credentials come
# from the standard AWS chain (environment, shared config, IAM role) unless
# access-key/secret-key are given as query params — remember the config file
# templates ${ENV_VARS}, so secrets belong in the environment either way.
# There are no transactions: operations apply immediately and are not rolled
# back if the body fails, so write migrations to be idempotent.
# Applied-migration tracking lives in the graviton-migrations.json object.
#
# Local MinIO variant:
#   connection_url = "s3://graviton-example?endpoint=http://localhost:9000&path-style=true&access-key=${MINIO_ACCESS_KEY}&secret-key=${MINIO_SECRET_KEY}"

migrations_db = "assets"
migrations_path = "./migrations"

[[databases]]
name = "assets"
kind = "s3"
connection_url = "s3://my-bucket/app-assets?region=us-east-1"
