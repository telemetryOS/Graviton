# Example Graviton configuration (v2).
#
# There is one linear, ordered migration set for the whole project, in a single
# migrations directory. migrations_db names the [[databases]] entry where the
# applied-migration tracking lives.

migrations_db = "example"
migrations_path = "./migrations"

[[databases]]
name = "example"
kind = "mongodb"
connection_url = "mongodb://localhost:27017"
database_name = "test"
